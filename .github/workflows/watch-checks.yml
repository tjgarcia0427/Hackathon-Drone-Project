name: Watch and server checks
on:
  push:
    branches: [main]
    paths:
      - 'watch-app/**'
      - 'server/**'
      - '.github/workflows/watch-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Server regression tests (mocked AI and aircraft)
        run: |
          python -m pip install -r server/requirements.txt
          python -m unittest discover -s server -p 'test_*.py' -v
      - name: Watch gesture, GPS and retry core tests
        run: bash watch-app/test-core-mac.sh
      - name: Compile Watch app for simulator (no signing or account)
        run: |
          xcodebuild -project watch-app/GuardianWatch.xcodeproj -scheme GuardianWatch \
            -configuration Debug -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO PRODUCT_BUNDLE_IDENTIFIER=com.guardianangel.ci.watch build
