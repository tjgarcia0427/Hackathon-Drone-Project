name: Aircraft telemetry checks
on:
  push:
    branches: [main, ui-redesign]
    paths:
      - 'iphone-bridge/**'
      - 'server/**'
      - 'integrations/openclaw/**'
      - '.github/workflows/telemetry-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-server:
    if: github.ref_name == 'ui-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s server -p 'test_*.py' -v
  telemetry:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify flight and video preservation
        run: python3 iphone-bridge/tests/check_telemetry_preservation.py
      - name: Test production agent takeoff confirmation methods
        run: python3 iphone-bridge/tests/agent_takeoff_request_test.py
      - name: Test native observations and navigation limits
        run: |
          xcrun clang -fobjc-arc -framework Foundation -Iiphone-bridge/ios/GuardianAngel iphone-bridge/tests/telemetry_display_test.m -o /tmp/telemetry_display_test
          /tmp/telemetry_display_test
          xcrun clang iphone-bridge/tests/navigation_test.c iphone-bridge/ios/GuardianAngel/Navigation.c -lm -o /tmp/navigation_test
          /tmp/navigation_test
          xcrun clang -std=c11 -Wall -Wextra -Werror -Iiphone-bridge/ios/GuardianAngel iphone-bridge/tests/pilot_takeoff_test.c -lm -o /tmp/pilot_takeoff_test
          /tmp/pilot_takeoff_test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test OpenClaw plugin contracts
        if: github.ref_name == 'main'
        run: node --test integrations/openclaw/test/*.test.mjs
      - name: Test dashboard freshness and zero altitude
        run: |
          node server/test_telemetry_display.js
          node server/test_telemetry_panel.js
          node server/test_dashboard.js
      # ui-redesign already builds the real DJI app in iphone-ui-checks.yml.
      - uses: ruby/setup-ruby@v1
        if: github.ref_name == 'main'
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: iphone-bridge/ios
      - name: Install pinned DJI dependencies
        if: github.ref_name == 'main'
        working-directory: iphone-bridge/ios
        run: |
          cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig
          bundle exec pod install
      - name: Compile and link production iPhone app (unsigned)
        if: github.ref_name == 'main'
        working-directory: iphone-bridge/ios
        run: |
          set -o pipefail
          xcodebuild -workspace GuardianAngel.xcworkspace -scheme GuardianAngel -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-ci \
            CODE_SIGNING_ALLOWED=NO build > build-ci.log 2>&1 || { tail -150 build-ci.log; exit 1; }
          tail -8 build-ci.log
      - uses: actions/upload-artifact@v4
        if: always() && github.ref_name == 'main'
        with:
          name: telemetry-iphone-build-log
          path: iphone-bridge/ios/build-ci.log
