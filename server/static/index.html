<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rescue Command Center</title>
<style>
  :root { --bg:#0b0f14; --panel:#131a22; --line:#22303d; --txt:#e6edf3; --dim:#8b98a5; --ok:#2ecc71; --warn:#f39c12; --bad:#e74c3c; --acc:#4ea1ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; letter-spacing:.3px; }
  .phase { padding:4px 12px; border-radius:999px; font-weight:600; background:var(--line); text-transform:uppercase; font-size:12px; }
  .phase.found { background:var(--ok); color:#000; }
  .phase.searching, .phase.dispatched { background:var(--warn); color:#000; }
  .phase.aborted { background:var(--bad); }
  main { display:grid; grid-template-columns: 1.2fr 1fr; gap:16px; padding:16px 20px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .panel h2 { margin:0 0 10px; font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  .kv span:first-child { color:var(--dim); }
  img#cam { width:100%; border-radius:8px; background:#000; aspect-ratio:16/9; object-fit:cover; }
  #log { font-family:ui-monospace,Menlo,monospace; font-size:12px; max-height:340px; overflow:auto; white-space:pre-wrap; }
  #log div { padding:2px 0; border-bottom:1px dashed var(--line); }
  .btn { background:var(--acc); color:#000; border:0; border-radius:8px; padding:10px 16px; font-weight:700; cursor:pointer; margin-right:8px; }
  .btn.danger { background:var(--bad); color:#fff; }
  .btn.ghost { background:transparent; color:var(--dim); border:1px solid var(--line); }
  .found-banner { display:none; background:var(--ok); color:#000; padding:14px; border-radius:10px; font-weight:800; font-size:18px; margin-bottom:12px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--bad); margin-right:6px; }
  .dot.on { background:var(--ok); }
</style>
</head>
<body>
<header>
  <h1>🚁 Rescue Command Center</h1>
  <span id="phase" class="phase">idle</span>
  <span style="margin-left:auto"><span id="dronedot" class="dot"></span><span id="dronetxt">no drone</span></span>
</header>
<main>
  <section>
    <div id="foundBanner" class="found-banner"></div>
    <div class="panel">
      <h2>Live camera</h2>
      <img id="cam" src="" alt="waiting for frames">
      <div id="det" style="margin-top:6px;color:var(--dim)">detector: —</div>
    </div>
    <div class="panel" style="margin-top:16px">
      <h2>Controls</h2>
      <button class="btn" onclick="post('/dispatch')">Dispatch drone</button>
      <button class="btn danger" onclick="post('/abort')">Abort / RTL</button>
      <button class="btn ghost" onclick="post('/reset')">Reset</button>
      <button class="btn ghost" onclick="simulateFall()">Simulate fall (dev)</button>
    </div>
  </section>
  <section>
    <div class="panel">
      <h2>Incident</h2>
      <div id="incident" class="kv"><span>—</span><span></span></div>
    </div>
    <div class="panel" style="margin-top:16px">
      <h2>Mission plan (Claude → safety layer)</h2>
      <div id="plan" class="kv"><span>—</span><span></span></div>
    </div>
    <div class="panel" style="margin-top:16px">
      <h2>Drone</h2>
      <div id="drone" class="kv"><span>—</span><span></span></div>
    </div>
    <div class="panel" style="margin-top:16px">
      <h2>Log</h2>
      <div id="log"></div>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const kv = (el, obj) => { el.innerHTML = obj ? Object.entries(obj).map(([k,v]) => `<span>${k}</span><span>${typeof v==='number'? +v.toFixed(6) : v}</span>`).join('') : '<span>—</span><span></span>'; };
function render(s) {
  $('phase').textContent = s.phase; $('phase').className = 'phase ' + s.phase;
  $('dronedot').className = 'dot' + (s.drone_connected ? ' on' : '');
  $('dronetxt').textContent = s.drone_connected ? (s.drone?.drone_id || 'drone') + ' connected' : 'no drone';
  kv($('incident'), s.incident);
  kv($('plan'), s.plan ? {...s.plan, safety: s.plan_ok ? 'APPROVED' : 'REJECTED: ' + s.plan_reason} : null);
  kv($('drone'), s.drone);
  $('log').innerHTML = (s.log || []).map(fmtLog).join('');
  $('log').scrollTop = 1e9;
  if (s.found) { $('foundBanner').style.display='block';
    $('foundBanner').textContent = `SUBJECT LOCATED — ${s.found.distance_from_report_m} m from reported fall · confidence ${(s.found.confidence*100).toFixed(0)}% · drone holding`; }
  else $('foundBanner').style.display='none';
}
const fmtLog = e => `<div>${new Date(e.t*1000).toLocaleTimeString()}  ${e.msg}</div>`;
function connect() {
  const ws = new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws/dashboard');
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type==='state') render(m.state);
    else if (m.type==='log') { $('log').insertAdjacentHTML('beforeend', fmtLog(m.entry)); $('log').scrollTop=1e9; }
    else if (m.type==='telemetry') kv($('drone'), m.drone);
    else if (m.type==='frame') { $('cam').src = '/frame.jpg?t=' + Date.now();
      $('det').textContent = 'detector: ' + (m.detection ? (m.detection.person ? `PERSON ${(m.detection.confidence*100).toFixed(0)}% ${JSON.stringify(m.detection.bbox)}` : 'no person') : 'not installed (Claude-only)'); }
  };
  ws.onclose = () => setTimeout(connect, 1500);
}
async function post(path, body) { const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined}); if(!r.ok) alert(await r.text()); }
async function simulateFall() {
  const s = await (await fetch('/state')).json();
  const d = s.drone || {latitude:25.7617, longitude:-80.1918};
  post('/incident', {latitude: d.latitude + 0.00016, longitude: d.longitude + 0.00007, accuracy: 8, source: 'dashboard-dev'});
}
connect();
</script>
</body>
</html>
